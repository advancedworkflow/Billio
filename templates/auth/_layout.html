{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>{% block title %}Billio{% endblock %} - Billio</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/logo/favicon-32.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/logo/favicon-180.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <link href="{% static 'css/app.css' %}?v=1.6" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: 'Inter', system-ui, -apple-system, sans-serif; color: var(--billio-text); background: var(--billio-bg); display: flex; flex-direction: column; align-items: center; padding: 48px 16px; }
        .auth-top { position: fixed; top: 16px; right: 16px; }
        @media (max-width: 480px) { body { padding-top: 76px; } }
        .auth-logo { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 28px; text-decoration: none; color: var(--billio-text); font-family: var(--font-titles); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
        .auth-logo-badge { width: 36px; height: 36px; border-radius: 10px; background: var(--billio-primary); display: inline-flex; align-items: center; justify-content: center; }
        .auth-card { width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--billio-border); border-radius: 16px; padding: 32px 28px; box-shadow: 0 1px 2px rgba(24, 24, 27, .04); }
        @media (max-width: 440px) { .auth-card { padding: 26px 20px; } }
        .auth-title { font-family: var(--font-titles); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; margin: 0 0 6px; }
        .auth-lead { color: var(--billio-text-muted); font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
        .auth-field { display: block; margin-bottom: 16px; }
        .auth-field > span { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
        .auth-field > span a { font-weight: 500; font-size: 13px; }
        .auth-input { width: 100%; height: 44px; padding: 0 12px; font: inherit; font-size: 15px; color: var(--billio-text); background: #fff; border: 1px solid var(--billio-border-strong); border-radius: 10px; transition: border-color .15s, box-shadow .15s; }
        .auth-input:focus { outline: none; border-color: var(--billio-primary); box-shadow: 0 0 0 3px var(--billio-primary-soft); }
        select.auth-input { appearance: auto; }
        .auth-password { position: relative; }
        .auth-password .auth-input { padding-right: 76px; }
        .auth-toggle { position: absolute; right: 6px; top: 6px; height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--billio-text-muted); font: 500 13px/1 Inter, sans-serif; cursor: pointer; }
        .auth-toggle:hover { background: var(--billio-bg); color: var(--billio-text); }
        .auth-error { margin: 6px 0 0; font-size: 13px; color: var(--billio-error); }
        .auth-help { margin: 6px 0 0; font-size: 13px; color: var(--billio-text-muted); }
        .auth-help ul { margin: 0; padding-left: 18px; }
        .auth-alert { border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; font-size: 14px; line-height: 1.45; }
        .auth-alert--error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
        .auth-alert--success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
        .auth-alert--info { background: var(--billio-primary-soft); border: 1px solid var(--billio-primary-soft-border); color: var(--billio-primary-hover); }
        .auth-submit-btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 46px; margin-top: 4px; font: 600 15px/1 Inter, sans-serif; color: #fff; background: var(--billio-primary); border: 0; border-radius: 10px; cursor: pointer; text-decoration: none; transition: background .15s; }
        .auth-submit-btn:hover { background: var(--billio-primary-hover); }
        .auth-submit-btn:focus-visible, .auth-input:focus-visible, .auth-toggle:focus-visible { outline: 2px solid var(--billio-primary); outline-offset: 2px; }
        .auth-link { color: var(--billio-primary); font-weight: 600; text-decoration: none; }
        .auth-link:hover { text-decoration: underline; }
        .auth-legal { margin: 14px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--billio-text-muted); text-align: center; }
        .auth-legal a { color: inherit; text-decoration: underline; }
        .auth-switch { margin-top: 22px; font-size: 14px; color: var(--billio-text-muted); text-align: center; }
        .auth-logo-badge svg { width: 20px; height: 20px; }
        .auth-icon svg { width: 22px; height: 22px; }
        .auth-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--billio-primary-soft); color: var(--billio-primary); margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="auth-top">{% include "components/language_switcher.html" %}</div>
    <a href="/" class="auth-logo">
        <span class="auth-logo-badge">{% include "components/logo_mark_on_violet.html" with class="w-5 h-5" %}</span>
        Billio
    </a>
    <main class="auth-card">
        {% block content %}{% endblock %}
    </main>
    {% block after_card %}{% endblock %}
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script>
        window.lucide && lucide.createIcons();
        // Afficher / masquer le mot de passe
        document.querySelectorAll('[data-toggle-password]').forEach((button) => {
            const input = document.getElementById(button.dataset.togglePassword);
            button.addEventListener('click', () => {
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                button.textContent = show ? 'Masquer' : 'Afficher';
                button.setAttribute('aria-pressed', String(show));
            });
        });
    </script>
</body>
</html>
