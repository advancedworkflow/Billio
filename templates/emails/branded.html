<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b;" translate="no">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:24px 12px;">
  <tr><td align="center">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#ffffff;border-radius:14px;overflow:hidden;border:1px solid #e4e4e7;">
      <tr><td style="height:6px;background:{{ color }};font-size:0;line-height:0;">&nbsp;</td></tr>
      <tr><td style="padding:24px 32px 8px;">
        {% if logo_url %}<img src="{{ logo_url }}" alt="{{ org_name }}" style="display:block;max-height:52px;max-width:220px;border:0;">
        {% else %}<span style="font-size:20px;font-weight:bold;color:{{ color }};">{{ org_name }}</span>{% endif %}
      </td></tr>
      {% if banner_url %}<tr><td style="padding:16px 32px 0;"><img src="{{ banner_url }}" alt="" width="536" style="display:block;width:100%;max-width:536px;height:auto;border:0;border-radius:10px;"></td></tr>{% endif %}
      <tr><td style="padding:20px 32px 8px;font-size:15px;line-height:1.6;color:#27272a;">
        {{ body_html }}
      </td></tr>
      {% if button %}<tr><td style="padding:8px 32px 8px;">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="border-radius:10px;background:{{ color }};">
          <a href="{{ button.1 }}" style="display:inline-block;padding:13px 24px;font-size:15px;font-weight:bold;color:#ffffff;text-decoration:none;border-radius:10px;">{{ button.0 }}</a>
        </td></tr></table>
      </td></tr>{% endif %}
      <tr><td style="padding:20px 32px 28px;">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
          {% if photo_url %}<td style="padding-right:14px;vertical-align:top;"><img src="{{ photo_url }}" alt="" width="52" height="52" style="display:block;width:52px;height:52px;border-radius:50%;object-fit:cover;border:0;"></td>{% endif %}
          <td style="font-size:14px;line-height:1.5;color:#3f3f46;vertical-align:middle;">{{ signature_html }}</td>
        </tr></table>
      </td></tr>
      <tr><td style="padding:16px 32px;background:#fafafa;border-top:1px solid #f0f0f2;font-size:12px;line-height:1.5;color:#71717a;">{{ footer }}</td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
