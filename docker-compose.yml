# Billio sur un serveur (VPS) : base PostgreSQL, application, worker et HTTPS automatique (Caddy).
#   1. copier env.example en .env.production et le remplir (DOMAIN, SECRET_KEY, RESEND_API_KEY…)
#   2. docker compose --env-file .env.production up -d
# Chez un hébergeur « plateforme » (Scaleway Serverless, Render, Railway…), seule l'image
# (Dockerfile) sert : un service « web » et un service « worker » avec la même image.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: billio
      POSTGRES_USER: billio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Renseignez POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billio"]
      interval: 10s
      retries: 5

  web:
    image: ${BILLIO_IMAGE:-billio:latest}
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://billio:${POSTGRES_PASSWORD}@db:5432/billio
      DATABASE_SSL: "0"
      NUM_PROXIES: "1"
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    command: ["web"]

  worker:
    image: ${BILLIO_IMAGE:-billio:latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://billio:${POSTGRES_PASSWORD}@db:5432/billio
      DATABASE_SSL: "0"
    volumes:
      - media:/data/media
    depends_on:
      web:
        condition: service_healthy
    command: ["worker"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Renseignez DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - media:/srv/media:ro
    depends_on:
      - web

volumes:
  pgdata:
  media:
  caddy_data:
