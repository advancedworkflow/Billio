# Billio sur un serveur (VPS) : application, worker et HTTPS automatique (Caddy).
#   1. copier env.example en .env.production et le remplir (DOMAIN, SECRET_KEY, DATABASE_URL, RESEND_API_KEY…)
#   2. docker compose --env-file .env.production up -d
#
# Base de données :
#   - base managée (DigitalOcean, Scaleway…) : DATABASE_URL dans .env.production, DATABASE_SSL=1 ;
#   - base sur le serveur : ajouter --profile local-db, POSTGRES_PASSWORD et
#     DATABASE_URL=postgres://billio:<POSTGRES_PASSWORD>@db:5432/billio avec DATABASE_SSL=0.
# Chez un hébergeur « plateforme » (Scaleway Serverless, Render, Railway…), seule l'image
# (Dockerfile) sert : un service « web » et un service « worker » avec la même image.
services:
  web:
    image: ${BILLIO_IMAGE:-billio:latest}
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      NUM_PROXIES: "1"
    volumes:
      - media:/data/media
    command: ["web"]

  worker:
    image: ${BILLIO_IMAGE:-billio:latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      MIGRATE_ON_START: "0"
    volumes:
      - media:/data/media
    depends_on:
      web:
        condition: service_healthy
    # Pas de site dans le worker : sa santé se suit par https://<domaine>/healthz/?worker=1
    healthcheck:
      disable: true
    command: ["worker"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Renseignez DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - media:/srv/media:ro
    depends_on:
      - web

  db:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: billio
      POSTGRES_USER: billio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billio"]
      interval: 10s
      retries: 5

volumes:
  pgdata:
  media:
  caddy_data:
